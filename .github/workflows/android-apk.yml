name: Build FieldWorks APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - 'fieldworks-version.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Install Android 36 SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set app version
        shell: bash
        run: |
          RELEASE_VERSION=$(sed -n 's/^releaseVersion=//p' fieldworks-version.properties)
          BUILD_NUMBER=$(sed -n 's/^buildNumber=//p' fieldworks-version.properties)
          if [[ ! "$RELEASE_VERSION" =~ ^V[0-9]+\.[0-9]+\.[0-9]{2}$ ]] || [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid FieldWorks release/build in fieldworks-version.properties"
            exit 1
          fi
          BUILD_LABEL=$(printf '%02d' "$BUILD_NUMBER")
          VERSION_NAME="$RELEASE_VERSION Build $BUILD_LABEL"
          APK_FILENAME="FieldWorks $VERSION_NAME.apk"
          VERSION_CODE=$((192 + GITHUB_RUN_NUMBER))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_FILENAME=$APK_FILENAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building $APK_FILENAME (versionCode $VERSION_CODE)"

      - name: Restore the existing release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "One or more Android signing secrets are missing."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/fieldworks-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if ! KEY_LIST="$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" 2>&1)"; then
            echo "Could not read the keystore. Check STORE_PASSWORD."
            exit 1
          fi
          KEY_ALIAS="$(printf '%s\n' "$KEY_LIST" | awk -F, '/PrivateKeyEntry/ { alias=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", alias); count++ } END { if (count != 1) exit 1; print alias }')" || {
            echo "Expected exactly one private-key entry in the keystore."
            exit 1
          }
          unset KEY_LIST
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        run: |
          gradle --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$APK_FILENAME"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILENAME }}
          path: app/build/outputs/apk/release/${{ env.APK_FILENAME }}
          if-no-files-found: error
          retention-days: 30

plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
def appVersionCode = providers.gradleProperty('versionCode').orElse('1').get().toInteger()
def appVersionName = providers.gradleProperty('versionName').orElse('0.1 build 01').get()
android {
    namespace 'com.fieldworks.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.fieldworks.app'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }
    signingConfigs {
        release {
            def storePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (storePath != null && !storePath.isBlank()) {
                storeFile file(storePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH') != null) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

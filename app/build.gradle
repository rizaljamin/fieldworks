plugins { id 'com.android.application' }
def appVersionCode = providers.gradleProperty('versionCode').orElse('1').get().toInteger()
def appVersionName = providers.gradleProperty('versionName').orElse('0.1 build 01').get()
android {
    namespace 'com.fieldworks.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fieldworks.app'
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }
    signingConfigs {
        release {
            def storePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (storePath != null && !storePath.isBlank()) {
                storeFile file(storePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH') != null) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

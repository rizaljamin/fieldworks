<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f2">
  <title>FieldWorks — Under Construction</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8f2;
      color: #23352a;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 420px);
      display: grid;
      justify-items: center;
      gap: 20px;
      padding: 40px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #e3e9df;
      border-radius: 24px;
      box-shadow: 0 12px 36px rgba(35, 53, 42, .08);
    }
    img { display: block; width: 112px; height: 112px; object-fit: contain; }
    h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -.03em; }
    .status {
      margin: 0;
      padding: 9px 16px;
      border-radius: 999px;
      background: #edf4e8;
      color: #385a35;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main aria-label="FieldWorks under construction">
    <img src="fieldworks-icon.png" alt="FieldWorks icon">
    <h1>FieldWorks</h1>
    <p class="status">Under Construction</p>
  </main>
</body>
</html>

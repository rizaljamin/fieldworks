<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#082c50">
<title>FieldWorks — Under Construction</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f8f2;color:#16364c;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(100%,440px);display:grid;justify-items:center;gap:26px;padding:40px 28px;text-align:center;background:#fff;border:1px solid #e3e9df;border-radius:24px;box-shadow:0 12px 36px rgba(8,44,80,.08)}
.logo{display:block;width:min(100%,340px);height:auto}
.tagline{margin:0;padding:10px 18px;border-radius:999px;background:#edf4e8;color:#385a35;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.enter{min-width:160px;padding:13px 24px;border:0;border-radius:12px;background:#138c92;color:#fff;font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.enter:focus-visible{outline:3px solid #8bd5d2;outline-offset:3px}
</style>
</head>
<body>
<main class="card" aria-label="FieldWorks under construction">
<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">FieldWorks</title><desc id="desc">A globe crossed by a route with three project milestones.</desc>
<rect x="18" y="18" width="364" height="364" rx="52" fill="#fff" stroke="#082c50" stroke-width="24"/>
<g fill="none" stroke="#48c2c5" stroke-width="11" stroke-linecap="round"><circle cx="200" cy="200" r="130"/><path d="M200 70 C125 116 125 284 200 330"/><path d="M200 70 C275 116 275 284 200 330"/><path d="M77 178 C135 220 265 220 323 178"/></g>
<path d="M82 280 C135 236 205 210 304 105" fill="none" stroke="#082c50" stroke-width="28" stroke-linecap="round"/>
<g stroke="#fff" stroke-width="8"><circle cx="84" cy="280" r="28" fill="#138c92"/><circle cx="197" cy="221" r="31" fill="#f5a11a"/><circle cx="304" cy="105" r="28" fill="#138c92"/></g>
<text x="430" y="257" font-family="Arial,Helvetica,sans-serif" font-size="148" font-weight="700" letter-spacing="-5"><tspan fill="#082c50">Field</tspan><tspan fill="#138c92">Works</tspan></text>
</svg>
<p class="tagline">Under Construction</p>
<button class="enter" type="button" onclick="window.location.href='/assets/workspace.html'">Enter</button>
</main>
</body>
</html>
